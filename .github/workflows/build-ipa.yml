# Builds DroidRun.ipa: the official Husk 3.4 IPA as the base, with
#   - this repository's app bundle: DroidRun.app, com.droidrun.app, its executable (Swift app + translation layer: GC,
#     AVPlayer bridge, ClearKey), icons and translations; the base's Husk app extensions are left out,
#   - JIT-less dylibs made from Husk's Java runtime libraries and the native libraries of every APK in packager/input,
#   - this repository's Java framework (packager/runtime/*.dex),
#   - compiled Dalvik methods (dexc-v*-<dex signature>.dylib): the hot methods of the APKs and of the boot class path,
#   - the home-screen name "DroidRun".
# The user's own APKs come from a private repository (.github/actions/private-apks, secret APKS_DEPLOY_KEY); whatever carries
# them leaves the runners locked with the ARTIFACT_KEY secret (packager/lock.sh), since this repository is public.
# Output: the "DroidRun-ipa" artifact, DroidRun-ipa.lock: unlock it on the PC (packager/lock.sh), install with Sideloadly.
#
# Manual start only (Actions > Build DroidRun IPA > Run workflow): macOS minutes count 10x on private repositories.
name: Build DroidRun IPA

on:
  workflow_dispatch:
    inputs:
      name:
        description: "Name under the icon"
        default: "DroidRun"
      profile_seconds:
        description: "Seconds each APK runs on the Mac to find its hot methods (the dex compiler)"
        default: "90"

env:
  HUSK_REPO: Leviidev/Husk
  # The official IPA this build is based on. Its resources (QEMU, ANGLE, MoltenVK, java-runtime) must match the
  # source this repository forked from: commit 29abb51 = Husk 3.4 (build 149).
  HUSK_RELEASE: "3.4"

jobs:
  app:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Pick newest Xcode
        run: |
          X=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$X"
          xcodebuild -version

      - name: Fetch Husk IPA (prebuilt libraries to link against)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$HUSK_RELEASE" -R "$HUSK_REPO" -p Husk.ipa -D dl
          unzip -q dl/Husk.ipa -d dl/ipa
          mkdir -p build/ios-arm64/lib
          cp dl/ipa/Payload/Husk.app/Frameworks/libqemu-aarch64-softmmu.dylib build/ios-arm64/lib/

      - name: Build libhusk_rppairing.a (Rust)
        run: |
          rustup target add aarch64-apple-ios
          bash scripts/build_rppairing_ios.sh

      - name: Project for the executable only
        run: |
          brew install xcodegen >/dev/null
          cd src/app
          ruby -ryaml -e '
            y = YAML.load_file("project.yml")
            t = y["targets"]["Husk"]
            t.delete("preBuildScripts"); t.delete("postBuildScripts")
            t["dependencies"] = [
              { "framework" => "../../build/ios-arm64/lib/libqemu-aarch64-softmmu.dylib", "embed" => false },
              { "framework" => "Frameworks/libFilePickerFix.dylib", "embed" => false } ]
            File.write("project.yml", y.to_yaml)'
          xcodegen generate --quiet

      - name: Build
        run: |
          cd src/app
          set -o pipefail
          xcodebuild -project Husk.xcodeproj -target Husk -sdk iphoneos -configuration Release \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build 2>&1 | tee build.log \
            | grep -E "error:|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" build.log || { grep -E "error:" build.log | head -40; exit 1; }
          # the bundle as built: executable, Info.plist (com.droidrun.app), Assets.car (icons), translations, resources
          APP=build/Release-iphoneos/DroidRun.app
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" -c "Print :CFBundleExecutable" "$APP/Info.plist"
          rm -rf "$APP/PlugIns" "$APP/_CodeSignature"
          mkdir -p "$GITHUB_WORKSPACE/out" && cp -R "$APP" "$GITHUB_WORKSPACE/out/"
          du -sh "$GITHUB_WORKSPACE/out/DroidRun.app"

      - uses: actions/upload-artifact@v4
        with:
          name: app
          path: out/DroidRun.app
          retention-days: 7

  dylibs:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/private-apks
        with:
          deploy-key: ${{ secrets.APKS_DEPLOY_KEY }}

      - name: Build converter (elf2macho-test)
        run: |
          bash tools/regress/build.sh tools/elf2macho-test.c "$GITHUB_WORKSPACE/elf2macho-test" 2>&1 | grep -E "error|warning: implicit" || true
          test -x "$GITHUB_WORKSPACE/elf2macho-test"

      - name: Fetch Husk IPA
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "$HUSK_RELEASE" -R "$HUSK_REPO" -p Husk.ipa -D dl

      - name: Collect libraries
        run: python3 packager/collect.py dl/Husk.ipa packager/input libs > /dev/null

      - name: Convert
        run: |
          mkdir -p out
          fail=0
          while IFS= read -r so; do
            ./elf2macho-test "$so" out/ --ios > /dev/null 2>&1 || fail=$((fail+1))
          done < <(find libs -name '*.so' | sort)
          echo "converted: $(ls out | wc -l), failed: $fail"
          test "$(ls out | wc -l)" -gt 0

      # converted from the user's apps too: locked (packager/lock.sh)
      - name: Lock
        env:
          ARTIFACT_KEY: ${{ secrets.ARTIFACT_KEY }}
        run: bash packager/lock.sh lock out dylibs.lock

      - uses: actions/upload-artifact@v4
        with:
          name: dylibs
          path: dylibs.lock
          retention-days: 3

  # The dex compiler: each APK in packager/input runs on the Mac harness for a while, interpreted, counting its methods' calls
  # (TL_DVM_PROFILE); the hot ones -- in the APKs and in the boot class path every app runs (libcore, the framework) -- are
  # compiled to C (tools/dexc) and into one iOS dylib per DEX file, which the app loads in place of interpreting them.
  dexc:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/private-apks
        with:
          deploy-key: ${{ secrets.APKS_DEPLOY_KEY }}

      - uses: ./.github/actions/mac-harness
        with:
          github-token: ${{ github.token }}

      - name: Profile the apps
        run: |
          mkdir -p out
          AAPT2=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 2>/dev/null | sort -V | tail -1)
          for apk in packager/input/*.apk; do
            pkg=$([ -n "$AAPT2" ] && "$AAPT2" dump packagename "$apk" 2>/dev/null || true)
            TL_PACKAGE="$pkg" TL_DEXC=0 TL_DVM_PROFILE="$GITHUB_WORKSPACE/out/p-$(basename "$apk").txt"               ./javaapp-test "$apk" ${{ inputs.profile_seconds }} 856 1852 > "out/$(basename "$apk").log" 2>&1 || true
          done
          cat out/p-*.txt > out/profile.txt 2>/dev/null || true
          echo "hot methods: $(wc -l < out/profile.txt)"

      - name: Compile hot methods
        run: |
          for f in packager/input/*.apk "$TL_FRAMEWORK" "$TL_FRAMEWORK_CORE" "$TL_ART"/javalib/*.jar; do
            python3 tools/dexc/dexc.py "$f" dexc-gen --profile out/profile.txt --max 6000 | sed 's/^[^:]*: /dex: /'
          done
          bash tools/dexc/build.sh dexc-gen dexc-out ios > /dev/null
          echo "compiled dylibs: $(ls dexc-out | wc -l)"

      # the user's apps' code and logs: locked (packager/lock.sh)
      - name: Lock
        if: always()
        env:
          ARTIFACT_KEY: ${{ secrets.ARTIFACT_KEY }}
        run: |
          bash packager/lock.sh lock dexc-out dexc.lock
          bash packager/lock.sh lock out dexc-profile.lock

      - uses: actions/upload-artifact@v4
        with:
          name: dexc
          path: dexc.lock
          retention-days: 3

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dexc-profile
          path: dexc-profile.lock
          retention-days: 7

  ipa:
    needs: [app, dylibs, dexc]
    runs-on: ubuntu-latest
    env:
      ARTIFACT_KEY: ${{ secrets.ARTIFACT_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: art

      - name: Fetch Husk IPA
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "$HUSK_RELEASE" -R "$HUSK_REPO" -p Husk.ipa -D dl

      - name: Pack
        run: |
          bash packager/lock.sh unlock art/dylibs/dylibs.lock lib
          bash packager/lock.sh unlock art/dexc/dexc.lock lib
          cp lib/dexc-out/*.dylib lib/out/ 2>/dev/null || echo "no compiled methods"
          python3 packager/pack.py dl/Husk.ipa lib/out DroidRun.ipa             --app art/app --runtime packager/runtime --name "${{ inputs.name }}" | tail -2
          bash packager/lock.sh lock DroidRun.ipa DroidRun-ipa.lock

      - uses: actions/upload-artifact@v4
        with:
          name: DroidRun-ipa
          path: DroidRun-ipa.lock
          compression-level: 0
          retention-days: 30
